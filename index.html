<!doctype html>
<html lang="en">
  <head>
    <link rel="shortcut icon" type="image/png" href="./icons8-favicon.gif" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medium - Connect HTML elements with only CSS - part 3</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./app.css" />
    <script type="module" src="./app.js"></script>
  </head>

  <body>
    <body class="app">
      <section class="app__body">
        <article class="box box--movable box--one"></article>
        <article class="box box--second"></article>

        <!--
        Links just be declared after boxes,
        because the anchor positioning is based on CSS vars
        and they are initialized when the DOM element is injected
        -->
        <div
          class="link"
          style="--moving-element: --box1; --static-element: --box2"
        ></div>
      </section>
    </body>
  </body>
</html>
